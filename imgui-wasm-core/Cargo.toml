[package]
name = "imgui_wasm"
version = "0.1.0"
edition = "2021"
description = "Web-based Dear ImGui backend - render ImGui in a browser via WebSocket"
license = "MIT"
repository = "https://github.com/n3in2019/imgui_wasm"
readme = "../README.md"
keywords = ["imgui", "web", "gui", "websocket"]
categories = ["gui", "web-programming"]

[lib]
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
cc = "1"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
lz4_flex = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
